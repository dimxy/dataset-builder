# Active backend: openai | ollama | pipeline
backend: openai

openai:
  model: qwen-plus-latest
  # model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 1024
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1 # override for OpenAI-compatible endpoints

ollama:
  base_url: http://localhost:11434
  model: llama3.2
  temperature: 0.7
  max_tokens: 1024

pipeline:
  model: microsoft/Phi-3-mini-4k-instruct
  device: cpu          # cpu | cuda | mps
  temperature: 0.7
  max_new_tokens: 1024
