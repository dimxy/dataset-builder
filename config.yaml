# Active backend: openai | ollama | pipeline
backend: pipeline

openai:
  model: qwen-plus-latest
  # model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 1024
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1 # override for OpenAI-compatible endpoints

ollama:
  base_url: http://localhost:11434
  # model: llama3.2
  model: qwen3.5:9b 
  temperature: 0.7
  max_tokens: 1024

pipeline:
  # Output is always constrained (via outlines) to a list of {"messages":[...]} conversations.
  # model: microsoft/Phi-3-mini-4k-instruct
  model: qwen/Qwen2-7B-Instruct
  device: cuda          # cpu | cuda | mps
  temperature: 0.7
  max_new_tokens: 2048
  max_turns: 8          # if max_new_tokens truncates the JSON, resume up to this many times
