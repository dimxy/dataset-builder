# Active backend: openai | ollama | pipeline
backend: pipeline

openai:
  model: qwen-plus-latest
  # model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 1024
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1 # override for OpenAI-compatible endpoints

ollama:
  base_url: http://localhost:11434
  # model: llama3.2
  model: qwen3.5:9b 
  temperature: 0.7
  max_tokens: 1024

pipeline:
  # Output is always constrained (via outlines) to a list of {"messages":[...]} conversations.
  # model: microsoft/Phi-3-mini-4k-instruct
  model: qwen/Qwen2-7B-Instruct
  device: cuda          # cpu | cuda | mps
  temperature: 0.7
  max_new_tokens: 2048  # base per-pass token budget; attempt k gets k * this
  max_attempts: 8       # if the JSON truncates, retry with a larger budget up to this many times

# Topic-expansion step (`python main.py --expand --topics ... --user prompts/expand-user.txt`).
# Multiplies each base topic into `count` distinct wordings so the small-context generator can
# make a small, duplicate-free batch per extended topic instead of overflowing on one big batch.
expand:
  backend: local       # openai | ollama | local — which model generates the wordings.
                        #   openai/ollama reuse their sections above (free text, parsed to a list).
                        #   local reuses the pipeline section, constrained to a JSON list of strings.
  count: 10             # wordings produced per base topic
  separator: " — "      # how each wording is joined onto its base topic in the output lines
